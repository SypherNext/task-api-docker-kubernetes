apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-api
spec:
  ingressClassName: example-ingress-class
  rules:
    - host: tasks.example.com
      http:
        paths:
          - path: /tasks
            pathType: Prefix
            backend:
              service:
                name: task-api
                port:
                  number: 80
