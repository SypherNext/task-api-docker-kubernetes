apiVersion: v1
kind: Pod
metadata:
  name: memory-hog
spec:
  containers:
    - name: hog
      image: node:26-alpine
      command: ["node", "-e", "const a = []; while (true) a.push(Buffer.alloc(1024 * 1024, 1))"]
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 64Mi
