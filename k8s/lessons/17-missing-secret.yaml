apiVersion: v1
kind: Pod
metadata:
  name: missing-secret
spec:
  containers:
    - name: task-api
      image: dkh-task-api:1.0.0
      env:
        - name: DB_HOST
          value: postgres
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentails
              key: password
